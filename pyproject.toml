[project]
name = "kgcourse"
version = "0.1.0"
description = "Data helpers and checks for the knowledge graph course"
requires-python = ">=3.11"
dependencies = ["rdflib", "pyshacl", "pyoxigraph"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
