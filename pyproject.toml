[project]
name = "kgcourse"
version = "0.1.0"
description = "Data helpers and checks for the knowledge graph course"
requires-python = ">=3.11"
dependencies = ["rdflib>=7,<8", "pyshacl>=0.40,<0.41", "pyoxigraph>=0.5,<0.6"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Default rules, plus docstrings on public modules, classes and functions, in the imperative mood.
extend-select = ["D1", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]
