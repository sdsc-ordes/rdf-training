<script type="application/json" id="lab-data">__LAB_DATA__</script>
<script>__RETE_ENGINE__</script>
<script>
(() => {
  "use strict";
  const LAB = JSON.parse(document.getElementById("lab-data").textContent);
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null) n.append(kid);
    return n;
  };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const fmtInt = (n) => Number(n).toLocaleString("en");
  const fmtSize = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`);

  const state = { datasets: [], active: null, view: "table", result: null, example: null, scratch: null };
  let seq = 0;

  // ---- prefixes and terms -------------------------------------------------
  const PREFIXES = LAB.prefixes;
  const prefixBlock = Object.entries(PREFIXES).map(([p, ns]) => `PREFIX ${p}: <${ns}>`).join("\n");

  function shorten(iri, extra) {
    let best = null;
    for (const [p, ns] of [...Object.entries(extra || {}), ...Object.entries(PREFIXES)]) {
      if (iri.startsWith(ns) && (!best || ns.length > best[1].length)) best = [p, ns];
    }
    if (best) {
      const local = iri.slice(best[1].length);
      if (/^[\w\-.%]*$/.test(local)) return `${best[0]}:${local}`;
    }
    return `<${iri}>`;
  }
  function queryPrefixes(q) {
    const out = {};
    for (const m of q.matchAll(/PREFIX\s+([\w-]*):\s*<([^>]*)>/gi)) out[m[1]] = m[2];
    return out;
  }
  // The engine returns terms as N-Triples tokens.
  function parseTerm(tok) {
    if (tok == null) return null;
    if (tok.startsWith("<<")) return { kind: "triple", value: tok };
    if (tok.startsWith("<")) return { kind: "iri", value: tok.slice(1, -1) };
    if (tok.startsWith("_:")) return { kind: "bnode", value: tok };
    if (tok.startsWith('"')) {
      const end = tok.lastIndexOf('"');
      let value = tok.slice(1, end);
      try { value = JSON.parse(`"${value}"`); } catch { value = value.replace(/\\(["\\])/g, "$1").replace(/\\n/g, "\n"); }
      const rest = tok.slice(end + 1);
      const t = { kind: "literal", value, lang: null, datatype: null };
      if (rest.startsWith("@")) t.lang = rest.slice(1);
      else if (rest.startsWith("^^<")) t.datatype = rest.slice(3, -1);
      return t;
    }
    return { kind: "literal", value: String(tok), lang: null, datatype: null };
  }
  const XSD = "http://www.w3.org/2001/XMLSchema#";
  const NUMERIC = new Set(["integer", "decimal", "double", "float", "int", "long", "short", "nonNegativeInteger", "positiveInteger"].map((t) => XSD + t));
  const isNum = (t) => t && t.kind === "literal" && NUMERIC.has(t.datatype) && Number.isFinite(Number(t.value));
  const plain = (t, px) => (!t ? "" : t.kind === "iri" ? shorten(t.value, px) : t.value);

  function termNode(t, px) {
    if (!t) return el("span", { class: "bn" }, "—");
    if (t.kind === "iri") return el("a", { class: "iri", href: t.value, target: "_blank", rel: "noopener", title: t.value }, shorten(t.value, px));
    if (t.kind !== "literal") return el("span", { class: "bn" }, t.value);
    const span = el("span", {}, t.value);
    if (t.lang) span.append(el("span", { class: "tag" }, `@${t.lang}`));
    else if (t.datatype && !isNum(t) && t.datatype !== XSD + "string") span.append(el("span", { class: "tag" }, shorten(t.datatype, px)));
    return span;
  }

  // ---- datasets -----------------------------------------------------------
  async function addDataset(name, origin, bytes, opts = {}) {
    const graph = await rete.open(bytes);
    const info = graph.info();
    const ds = { id: opts.id || `g${++seq}`, name, origin, bytes, graph, quads: info.quads, url: opts.url || null };
    const at = state.datasets.findIndex((d) => d.id === ds.id);
    if (at >= 0) state.datasets[at] = ds; else state.datasets.push(ds);
    if (opts.activate || !state.active) state.active = ds.id;
    renderDatasets();
    return ds;
  }
  const active = () => state.datasets.find((d) => d.id === state.active) || null;

  function download(ds) {
    const a = el("a", { href: URL.createObjectURL(new Blob([ds.bytes], { type: "application/octet-stream" })), download: `${ds.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "graph"}.rete` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function renderDatasets() {
    const list = $("datasets");
    list.replaceChildren(...state.datasets.map((ds) =>
      el("li", { class: ds.id === state.active ? "on" : "" },
        el("button", { class: "pick", title: ds.url || ds.origin, "aria-pressed": String(ds.id === state.active), onclick: () => { state.active = ds.id; renderDatasets(); runQuery(); syncHash(); } },
          el("b", {}, ds.name), el("small", {}, `${fmtInt(ds.quads)} triples · ${fmtSize(ds.bytes.length)} · ${ds.origin}`)),
        el("button", { class: "icon", title: "Download .rete", "aria-label": `Download ${ds.name} as .rete`, onclick: () => download(ds) }, "⬇"),
        ds.id === "builtin" ? el("span") : el("button", { class: "icon", title: "Remove from memory", "aria-label": `Remove ${ds.name}`, onclick: () => removeDataset(ds.id) }, "✕"))));
    const a = active();
    $("on-label").textContent = a ? `on ${a.name}` : "";
    const combine = $("combine"), keep = combine.value;
    combine.replaceChildren(el("option", { value: "" }, "nothing"), ...state.datasets.filter((d) => d.id !== "scratch").map((d) => el("option", { value: d.id }, d.name)));
    combine.value = [...combine.options].some((o) => o.value === keep) ? keep : "";
  }
  function removeDataset(id) {
    state.datasets = state.datasets.filter((d) => d.id !== id);
    if (id === "scratch") { state.scratch = null; $("d-query").disabled = $("d-download").disabled = true; }
    if (state.active === id) state.active = state.datasets[0]?.id || null;
    renderDatasets(); runQuery(); syncHash();
  }

  async function openUrl(url, activate = true) {
    const msg = $("add-msg");
    msg.textContent = "Loading…";
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const bytes = new Uint8Array(await res.arrayBuffer());
      const name = decodeURIComponent(new URL(url, location.href).pathname.split("/").pop() || "remote").replace(/\.rete$/, "");
      await addDataset(name, "URL", bytes, { activate, url });
      msg.textContent = "";
      runQuery(); syncHash();
    } catch (e) {
      msg.textContent = `Could not open ${url}: ${e.message || e}. The host must allow cross-origin requests.`;
    }
  }
  async function openFile(file) {
    const msg = $("add-msg");
    try {
      const buf = new Uint8Array(await file.arrayBuffer());
      const ext = file.name.split(".").pop().toLowerCase();
      if (ext === "rete") {
        await addDataset(file.name.replace(/\.rete$/, ""), "file", buf, { activate: true });
        runQuery();
      } else {
        showTab("data");
        $("d").value = new TextDecoder().decode(buf);
        $("fmt").value = ext === "ttl" ? "ttl" : ext === "jsonld" || ext === "json" ? "jsonld" : "auto";
        buildData();
      }
      msg.textContent = "";
    } catch (e) { msg.textContent = `Could not open ${file.name}: ${e.message || e}`; }
  }

  // ---- live SPARQL --------------------------------------------------------
  function setStatus(id, kind, pill, txt) {
    const s = $(id);
    s.className = `status ${kind}`;
    s.querySelector(".pill").textContent = pill;
    s.querySelector(".txt").textContent = txt || "";
  }
  const shortError = (e) => String(e && e.message ? e.message : e).replace(/expected one of[\s\S]*/, "unexpected token here").slice(0, 400);

  function runQuery() {
    const ds = active(), q = $("q").value;
    if (!ds) { setStatus("q-status", "", "no graph", "Add or pick a graph in the sidebar."); return; }
    if (!q.trim()) { setStatus("q-status", "", "empty", "Type a SPARQL query: it runs as you type."); return; }
    const t0 = performance.now();
    try {
      const raw = ds.graph.queryRaw(q);
      const ms = performance.now() - t0;
      const px = queryPrefixes(q);
      let result;
      if (raw.kind === "ask") result = { kind: "ask", boolean: raw.boolean, vars: [], rows: [], px };
      else if (raw.triples) result = { kind: "graph", vars: ["subject", "predicate", "object"], px, rows: raw.triples.map(([s, p, o]) => ({ subject: parseTerm(s), predicate: parseTerm(p), object: parseTerm(o) })) };
      else result = { kind: "select", vars: raw.vars, px, rows: raw.rows.map((r) => Object.fromEntries(raw.vars.map((v) => [v, parseTerm(r[v])]))) };
      state.result = result;
      const warn = (ds.graph.lastWarnings?.() || []).map((w) => w.message).join(" ");
      const count = result.kind === "ask" ? String(result.boolean) : `${fmtInt(result.rows.length)} ${result.kind === "graph" ? "triples" : "rows"}`;
      setStatus("q-status", "ok", "✓ valid", `${count} · ${ms < 10 ? ms.toFixed(1) : ms.toFixed(0)} ms${warn ? ` · ${warn}` : ""}`);
      $("out").classList.remove("stale");
      renderResult();
    } catch (e) {
      setStatus("q-status", "err", "✗ not valid", shortError(e));
      $("out").classList.add("stale"); // keep the last good answer on screen while the query is being edited
    }
  }

  // ---- result views -------------------------------------------------------
  function renderResult() {
    const out = $("out"), r = state.result;
    $("csv").disabled = !r || r.kind === "ask";
    if (!r) { out.replaceChildren(el("div", { class: "empty" }, "Results appear here as you type.")); return; }
    if (r.kind === "ask") { out.replaceChildren(el("div", { class: `bool ${r.boolean ? "t" : "f"}` }, r.boolean ? "true" : "false")); return; }
    if (!r.rows.length) { out.replaceChildren(el("div", { class: "empty" }, "The query is valid and matches nothing in this graph.")); return; }
    out.replaceChildren(state.view === "cards" ? cardsView(r) : state.view === "map" ? mapView(r) : tableView(r));
  }
  function tableView(r) {
    return el("table", {},
      el("thead", {}, el("tr", {}, r.vars.map((v) => el("th", {}, `?${v}`)))),
      el("tbody", {}, r.rows.map((row) => el("tr", {}, r.vars.map((v) => el("td", { class: isNum(row[v]) ? "num" : "" }, termNode(row[v], r.px)))))));
  }
  function cardsView(r) {
    const [head, ...rest] = r.vars;
    return el("div", { class: "cards" }, r.rows.map((row) =>
      el("article", { class: "card" }, el("h3", {}, termNode(row[head], r.px)),
        el("dl", {}, rest.filter((v) => row[v]).map((v) => [el("dt", {}, v), el("dd", {}, termNode(row[v], r.px))])))));
  }
  const LAT = /^(lat|latitude|y)$/i, LON = /^(lon|long|lng|longitude|x)$/i, WKT = /POINT\s*\(\s*(-?[\d.]+)\s+(-?[\d.]+)\s*\)/i;
  function points(r) {
    const latV = r.vars.find((v) => LAT.test(v)), lonV = r.vars.find((v) => LON.test(v));
    const wktV = r.vars.find((v) => r.rows.some((row) => row[v] && row[v].kind === "literal" && WKT.test(row[v].value)));
    const coord = new Set(latV && lonV ? [latV, lonV] : wktV ? [wktV] : []);
    if (!coord.size) return null;
    const others = r.vars.filter((v) => !coord.has(v));
    const labelV = others.find((v) => r.rows.some((row) => row[v] && !isNum(row[v]))) || others[0];
    const sizeV = others.find((v) => r.rows.some((row) => isNum(row[v])));
    const pts = [];
    for (const row of r.rows) {
      let lat, lon;
      if (latV && lonV) { lat = Number(row[latV]?.value); lon = Number(row[lonV]?.value); }
      else { const m = WKT.exec(row[wktV]?.value || ""); if (m) { lon = Number(m[1]); lat = Number(m[2]); } }
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) continue;
      pts.push({ lat, lon, label: plain(row[labelV], r.px), size: sizeV && isNum(row[sizeV]) ? Number(row[sizeV].value) : null,
        tip: r.vars.filter((v) => row[v]).map((v) => `${v}: ${plain(row[v], r.px)}`).join("\n") });
    }
    return { pts, sizeV, labelV };
  }
  function mapView(r) {
    const found = points(r);
    if (!found || !found.pts.length) {
      return el("div", { class: "empty" }, "The map needs coordinates: select ", el("code", {}, "?lat"), " and ", el("code", {}, "?long"),
        " (or a WKT ", el("code", {}, "POINT(long lat)"), " literal). Another variable becomes the label, a numeric one the size. For example:",
        el("pre", {}, LAB.mapExample));
    }
    const { pts, sizeV, labelV } = found;
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    // equirectangular: x = longitude, y = -latitude; frame the points with a margin, at least 70° wide
    let x0 = Math.min(...pts.map((p) => p.lon)), x1 = Math.max(...pts.map((p) => p.lon));
    let y0 = Math.min(...pts.map((p) => -p.lat)), y1 = Math.max(...pts.map((p) => -p.lat));
    // ...then widen or heighten that frame to the shape of the pane, so a degree has a known size in pixels
    const box = $("out"), W = Math.max(200, box.clientWidth), H = Math.max(160, box.clientHeight - 30);
    let vw = Math.max(70, (x1 - x0) * 1.35), vh = Math.max(35, (y1 - y0) * 1.7);
    if (vw / vh < W / H) vw = vh * (W / H); else vh = vw / (W / H);
    x0 = (x0 + x1) / 2 - vw / 2; y0 = (y0 + y1) / 2 - vh / 2;
    svg.setAttribute("viewBox", `${x0} ${y0} ${vw} ${vh}`);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `Map with ${pts.length} points`);
    const land = document.createElementNS(NS, "path");
    land.setAttribute("class", "land"); land.setAttribute("d", LAB.world);
    svg.append(land);
    const px = vw / W, max = Math.max(1, ...pts.map((p) => p.size || 0)); // px: degrees per screen pixel
    const labels = [];
    for (const p of pts) {
      const c = document.createElementNS(NS, "circle");
      const rad = px * (p.size == null ? 6 : 5 + 11 * Math.sqrt(p.size / max));
      c.setAttribute("cx", p.lon); c.setAttribute("cy", -p.lat); c.setAttribute("r", rad);
      const tip = document.createElementNS(NS, "title"); tip.textContent = p.tip; c.append(tip);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", p.lon + rad + px * 4); t.setAttribute("y", -p.lat + px * 4.5);
      t.setAttribute("font-size", px * 13); t.setAttribute("stroke-width", px * 3);
      t.textContent = p.label + (p.size == null ? "" : ` · ${p.size}`);
      svg.append(c); labels.push(t);
    }
    svg.append(...labels); // labels above every circle
    return el("div", { class: "map" }, svg, el("div", { class: "note" },
      `${pts.length} of ${r.rows.length} rows placed · label ?${labelV}${sizeV ? ` · size ?${sizeV}` : ""} · hover a point for the full row`));
  }
  function csv() {
    const r = state.result; if (!r) return;
    const cell = (s) => (/[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);
    const text = [r.vars.join(","), ...r.rows.map((row) => r.vars.map((v) => cell(row[v] ? row[v].value : "")).join(","))].join("\n");
    const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "text/csv" })), download: "results.csv" });
    document.body.append(a); a.click(); a.remove();
  }

  // ---- live data editor: Turtle or JSON-LD -> .rete in memory -------------
  async function nquads(graph, tag) {
    let text = "";
    for await (const chunk of graph.nquads()) text += chunk;
    // keep blank nodes of two graphs apart when they are combined
    return tag ? text.replace(/(^|\s)_:([A-Za-z0-9]+)/gm, `$1_:${tag}$2`) : text;
  }
  let buildNo = 0;
  async function buildData() {
    const text = $("d").value, mine = ++buildNo;
    if (!text.trim()) { setStatus("d-status", "", "empty", "Write Turtle or JSON-LD: it is parsed as you type."); return; }
    const chosen = $("fmt").value;
    const fmt = chosen !== "auto" ? chosen : /^\s*[[{]/.test(text) ? "jsonld" : "ttl";
    const label = fmt === "ttl" ? "Turtle" : "JSON-LD";
    try {
      let bytes = await rete.build(text, fmt);
      const own = (await rete.open(bytes)).info().quads;
      const base = state.datasets.find((d) => d.id === $("combine").value);
      if (base) bytes = await rete.build((await nquads(base.graph, "b")) + (await nquads(await rete.open(bytes), "u")), "nq");
      if (mine !== buildNo) return; // a newer edit is already being built
      const ds = await addDataset(base ? `My graph + ${base.name}` : "My graph", "built here", bytes, { id: "scratch" });
      state.scratch = ds;
      $("d-query").disabled = $("d-download").disabled = false;
      setStatus("d-status", "ok", `✓ valid ${label}`, `${fmtInt(own)} triples${base ? ` + ${fmtInt(base.quads)} from ${base.name} = ${fmtInt(ds.quads)}` : ""} · .rete ${fmtSize(bytes.length)}, in memory`);
      if (state.active === "scratch") runQuery();
    } catch (e) {
      if (mine !== buildNo) return;
      setStatus("d-status", "err", `✗ not valid ${label}`, shortError(e));
    }
  }

  // ---- tabs, examples, link state -----------------------------------------
  function showTab(name) {
    const data = name === "data";
    $("tab-sparql").setAttribute("aria-selected", String(!data));
    $("tab-data").setAttribute("aria-selected", String(data));
    for (const id of ["q", "q-status", "sparql-tools"]) $(id).hidden = data;
    for (const id of ["d", "d-status", "d-actions", "data-tools"]) $(id).hidden = !data;
    if (data && !$("d").value) { $("d").value = LAB.starterTurtle; buildData(); }
  }
  function setView(view) {
    state.view = ["table", "cards", "map"].includes(view) ? view : "table";
    for (const b of $("views").children) b.setAttribute("aria-selected", String(b.dataset.view === state.view));
    renderResult();
  }
  function loadExample(ex) {
    state.example = ex.id;
    $("q").value = ex.query;
    for (const b of $("examples").querySelectorAll("button")) b.classList.toggle("on", b.dataset.id === ex.id);
    showTab("sparql");
    if (ex.view) setView(ex.view);
    runQuery(); syncHash();
  }
  function link() {
    const p = new URLSearchParams(), ds = active();
    if (ds && ds.url) p.set("url", ds.url);
    if (state.view !== "table") p.set("view", state.view);
    p.set("q", $("q").value);
    return `${location.href.split("#")[0]}#${p}`;
  }
  const syncHash = debounce(() => { try { history.replaceState(null, "", link()); } catch { /* file:// in some browsers */ } }, 400);

  // ---- wiring -------------------------------------------------------------
  $("ver").textContent = LAB.version;
  $("examples").replaceChildren(...LAB.examples.map((ex) =>
    el("li", {}, el("button", { "data-id": ex.id, title: ex.title, onclick: () => loadExample(ex) }, el("code", {}, ex.id), ex.title))));
  $("q").addEventListener("input", () => { state.example = null; for (const b of $("examples").querySelectorAll("button.on")) b.classList.remove("on"); });
  $("q").addEventListener("input", debounce(() => { runQuery(); syncHash(); }, 200));
  $("d").addEventListener("input", debounce(buildData, 300));
  for (const ta of [$("q"), $("d")]) ta.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) { e.preventDefault(); ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
  });
  $("tab-sparql").onclick = () => showTab("sparql");
  $("tab-data").onclick = () => showTab("data");
  $("views").onclick = (e) => { if (e.target.dataset.view) { setView(e.target.dataset.view); syncHash(); } };
  $("fmt").onchange = buildData;
  $("combine").onchange = buildData;
  $("prefixes").onclick = () => { $("q").value = `${prefixBlock}\n\n${$("q").value}`; runQuery(); syncHash(); };
  $("d-example").onclick = () => { $("d").value = LAB.starterJsonld; $("fmt").value = "auto"; buildData(); };
  $("d-query").onclick = () => { state.active = "scratch"; renderDatasets(); showTab("sparql"); runQuery(); syncHash(); };
  $("d-download").onclick = () => state.scratch && download(state.scratch);
  $("csv").onclick = csv;
  $("share").onclick = async () => {
    const b = $("share");
    try { await navigator.clipboard.writeText(link()); b.textContent = "Copied"; } catch { b.textContent = "See address bar"; history.replaceState(null, "", link()); }
    setTimeout(() => { b.textContent = "Copy link"; }, 1500);
  };
  $("url-form").onsubmit = (e) => { e.preventDefault(); openUrl($("url").value.trim()); };
  $("file-btn").onclick = () => $("file").click();
  $("file").onchange = (e) => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ""; };
  addEventListener("resize", debounce(() => { if (state.view === "map") renderResult(); }, 150));
  addEventListener("dragover", (e) => e.preventDefault());
  addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });

  (async () => {
    try {
      const kg = Uint8Array.from(atob(LAB.kg), (c) => c.charCodeAt(0));
      await addDataset(LAB.kgName, "built in", kg, { id: "builtin", activate: true });
    } catch (e) {
      setStatus("q-status", "err", "engine error", shortError(e));
      return;
    }
    const p = new URLSearchParams(location.hash.slice(1));
    const first = LAB.examples[0];
    $("q").value = p.get("q") ?? first.query;
    if (!p.has("q")) { state.example = first.id; $("examples").querySelector("button").classList.add("on"); }
    setView(p.get("view") || "table");
    runQuery();
    if (p.get("url")) await openUrl(p.get("url"));
  })();
})();
</script>
</body>
</html>
