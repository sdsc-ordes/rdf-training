name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run vendor/sdsc-slides/scripts/verify_tokens.py
      - name: Theme is generated from SDSC tokens
        run: |
          uv run vendor/sdsc-slides/scripts/build_slidev_theme.py -o "$RUNNER_TEMP/style.css"
          diff "$RUNNER_TEMP/style.css" slides/style.css

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build
